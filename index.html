<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Limausong — Playlist Pribadi</title>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <header class="navbar">

        <a
            href="#home"
            class="logo"
        >

            <span class="logo-icon">
                ♪
            </span>

            <span>
                Limausong
            </span>

        </a>


        <nav class="nav-menu">

            <a
                href="#songs"
                class="active"
            >
                My Playlist
            </a>

        </nav>


        <div class="nav-right">

            <button
                class="search-button"
                id="searchButton"
            >

                <span class="search-icon">
                    ⌕
                </span>

                <span>
                    Search
                </span>

            </button>


            <button class="login-button">
                Login
            </button>


            <button
                class="menu-button"
                id="menuButton"
            >
                ☰
            </button>

        </div>

    </header>


    <!-- =========================================
         MOBILE MENU
    ========================================== -->

    <div
        class="mobile-menu"
        id="mobileMenu"
    >

        <a href="#songs">
            My Playlist
        </a>

    </div>


    <!-- =========================================
         SEARCH OVERLAY — LIQUID GLASS
    ========================================== -->

    <div
        class="search-overlay"
        id="searchOverlay"
    >

        <!-- Glass backdrop orbs -->
        <div class="search-orb orb-1"></div>
        <div class="search-orb orb-2"></div>
        <div class="search-orb orb-3"></div>

        <div class="search-panel">

            <!-- Header -->
            <div class="search-panel-header">

                <div class="search-panel-title">
                    <span class="search-panel-icon">♪</span>
                    <span>Cari Lagu</span>
                </div>

                <button
                    class="close-search"
                    id="closeSearch"
                    aria-label="Close search"
                >
                    ×
                </button>

            </div>


            <!-- Search input -->
            <div class="search-input-wrap">

                <span class="search-input-icon">⌕</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Cari judul, artis, atau genre..."
                    autocomplete="off"
                    spellcheck="false"
                >

                <button
                    class="search-clear-btn"
                    id="searchClearBtn"
                    aria-label="Clear search"
                    style="display:none"
                >
                    ×
                </button>

            </div>


            <!-- Genre filter pills -->
            <div class="search-filters" id="searchFilters">

                <button
                    class="filter-pill active"
                    data-filter="all"
                >Semua</button>

                <button
                    class="filter-pill"
                    data-filter="Pop"
                >Pop</button>

                <button
                    class="filter-pill"
                    data-filter="R&B"
                >R&amp;B</button>

                <button
                    class="filter-pill"
                    data-filter="Rock"
                >Rock</button>

                <button
                    class="filter-pill"
                    data-filter="Jazz"
                >Jazz</button>

                <button
                    class="filter-pill"
                    data-filter="Electronic"
                >Electronic</button>

                <button
                    class="filter-pill"
                    data-filter="Indie"
                >Indie</button>

            </div>


            <!-- Results count -->
            <div class="search-meta" id="searchMeta">
                <span id="searchCount">Menampilkan semua lagu</span>
            </div>


            <!-- Playlist-style results list -->
            <div
                class="search-results-list"
                id="searchResults"
            ></div>


            <!-- Empty state -->
            <div
                class="search-empty"
                id="searchEmpty"
                style="display:none"
            >
                <div class="search-empty-icon">♪</div>
                <p>Lagu tidak ditemukan</p>
                <small>Coba kata kunci lain</small>
            </div>

        </div>

    </div>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main>


        <!-- =====================================
             MY PLAYLIST / SONGS
        ====================================== -->

        <section
            class="section playlist-section"
            id="songs"
            style="padding-top: 120px;"
        >

            <div class="section-heading">

                <div>

                    <span class="section-label">
                        KOLEKSI
                    </span>

                    <h2>
                        My Playlist
                    </h2>

                </div>


                <div class="playlist-actions">

                    <!-- Inline search bar in playlist section -->
                    <div class="playlist-search-bar">

                        <span>⌕</span>

                        <input
                            type="text"
                            id="playlistSearchInput"
                            placeholder="Filter lagu..."
                            autocomplete="off"
                        >

                    </div>


                    <button
                        class="see-all"
                        id="showAllSongs"
                    >
                        Semua →
                    </button>

                </div>

            </div>


            <!-- Column header -->
            <div class="playlist-header-row">
                <span>#</span>
                <span>Judul</span>
                <span class="hide-mobile">Artis</span>
                <span class="hide-mobile">Genre</span>
                <span></span>
            </div>


            <!-- Song list -->
            <div
                id="songList"
                class="song-list"
            ></div>


            <!-- No results -->
            <div
                id="noResults"
                class="playlist-no-results"
                style="display:none"
            >
                <span>♪</span>
                <p>Tidak ada lagu yang cocok</p>
            </div>

        </section>


    </main>



    <!-- =========================================
         MUSIC PLAYER
    ========================================== -->

    <div
        class="music-player"
        id="musicPlayer"
    >

        <!-- REAL AUDIO -->
        <audio
            id="audioPlayer"
            preload="metadata"
        ></audio>


        <!-- SONG -->

        <div class="player-song">

            <div
                class="player-cover"
                id="playerCover"
            >
                ♪
            </div>


            <div class="song-information">

                <strong id="songTitle">
                    Belum ada lagu
                </strong>

                <span id="songArtist">
                    Pilih lagu dulu
                </span>

            </div>

        </div>


        <!-- CONTROLS -->

        <div class="player-controls">

            <button
                id="previousButton"
                title="Previous"
            >
                ◀
            </button>


            <button
                class="main-play"
                id="playButton"
                title="Play"
            >
                ▶
            </button>


            <button
                id="nextButton"
                title="Next"
            >
                ▶
            </button>

        </div>


        <!-- PROGRESS -->

        <div class="player-progress">

            <span id="currentTime">
                0:00
            </span>


            <div
                class="progress-bar"
                id="progressBar"
            >

                <div
                    class="progress"
                    id="progress"
                ></div>

            </div>


            <span id="duration">
                0:00
            </span>

        </div>

    </div>


    <!-- =========================================
         JAVASCRIPT
    ====================    `====================== -->

    <script src="js/index.js"></script>

</body>

</html>
